{{- if and .Values.pdb.enabled (gt (int .Values.replicaCount) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "rethinkdb.fullname" . }}
  labels:
    {{- include "rethinkdb.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.pdb.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "rethinkdb.selectorLabels" . | nindent 6 }}
{{- end }}
