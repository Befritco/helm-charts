apiVersion: v1
kind: Pod
metadata:
  name: {{ include "rethinkdb.fullname" . }}-test-connection
  labels:
    {{- include "rethinkdb.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  {{- include "rethinkdb.imagePullSecrets" . | nindent 2 }}
  restartPolicy: Never
  containers:
    - name: nc
      image: {{ .Values.tests.image.registry }}/{{ .Values.tests.image.repository }}:{{ .Values.tests.image.tag }}
      imagePullPolicy: {{ .Values.tests.image.pullPolicy }}
      command:
        - sh
        - -ec
        - |
          # Driver Service, then every member individually through the headless Service.
          nc -z -w 5 {{ include "rethinkdb.fullname" . }} 28015
          for i in $(seq 0 {{ sub (int .Values.replicaCount) 1 }}); do
            nc -z -w 5 {{ include "rethinkdb.fullname" . }}-$i.{{ include "rethinkdb.fullname" . }}-headless 28015
          done
