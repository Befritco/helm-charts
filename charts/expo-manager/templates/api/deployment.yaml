{{- if and (gt (int .Values.api.replicaCount) 1) (not .Values.api.allowMultipleReplicas) -}}
{{- fail (printf "expo-manager: api.replicaCount=%d is not supported. The API has no socket.io adapter, its photos/reports volumes are ReadWriteOnce and the boot migration ledger is not a lock, so two replicas corrupt each other's state. Keep api.replicaCount=1, or set api.allowMultipleReplicas=true if you have addressed all three." (int .Values.api.replicaCount)) -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-api" (include "expo-manager.fullname" .) }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "expo-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with include "expo-manager.annotations" . }}
  {{- . | nindent 2 }}
  {{- end }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  strategy:
    type: {{ .Values.api.updateStrategy.type }}
  selector:
    matchLabels:
      {{- include "expo-manager.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "expo-manager.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- with .Values.api.podLabels }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/api/configmap.yaml") . | sha256sum }}
        {{- with .Values.api.podAnnotations }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
    spec:
      {{- with include "expo-manager.imagePullSecrets" . }}
      {{- . | nindent 6 }}
      {{- end }}
      serviceAccountName: {{ include "expo-manager.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      {{- with .Values.api.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.api.initContainers }}
      initContainers:
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "expo-manager.image" (dict "image" .Values.api.image "global" .Values.global "chart" .Chart) | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          {{- with .Values.api.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "expo-manager.secretName" . }}
                  key: jwt-secret
            - name: INITIAL_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "expo-manager.secretName" . }}
                  key: initial-user-password
            - name: EMAIL_SENDER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "expo-manager.secretName" . }}
                  key: email-sender-password
            {{- if eq .Values.email.auth "oauth2-m365" }}
            - name: EMAIL_SENDER_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "expo-manager.secretName" . }}
                  key: email-sender-oauth-client-secret
            {{- end }}
            - name: RETHINKDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "expo-manager.rethinkdb.secretName" . }}
                  key: rethinkdb-password
            {{- with .Values.api.extraEnvVars }}
            {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "expo-manager.configMapName" . }}
            {{- with .Values.api.extraEnvVarsCM }}
            - configMapRef:
                name: {{ tpl . $ }}
            {{- end }}
            {{- with .Values.api.extraEnvVarsSecret }}
            - secretRef:
                name: {{ tpl . $ }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.api.containerPort }}
              protocol: TCP
          {{- if .Values.api.startupProbe.enabled }}
          startupProbe:
            {{- include "expo-manager.httpProbe" (dict "probe" .Values.api.startupProbe "path" .Values.api.healthPath) | nindent 12 }}
          {{- end }}
          {{- if .Values.api.readinessProbe.enabled }}
          readinessProbe:
            {{- include "expo-manager.httpProbe" (dict "probe" .Values.api.readinessProbe "path" .Values.api.healthPath) | nindent 12 }}
          {{- end }}
          {{- if .Values.api.livenessProbe.enabled }}
          livenessProbe:
            {{- include "expo-manager.httpProbe" (dict "probe" .Values.api.livenessProbe "path" .Values.api.healthPath) | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: photos
              mountPath: /expo/photos
            - name: reports
              mountPath: /expo/reports
            - name: dshm
              mountPath: /dev/shm
            - name: tmp
              mountPath: /tmp
            {{- with .Values.api.extraVolumeMounts }}
            {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
      volumes:
        {{- range $name := list "photos" "reports" }}
        {{- $persistence := index $.Values.api.persistence $name }}
        - name: {{ $name }}
          {{- if $persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "expo-manager.api.claimName" (dict "name" $name "persistence" $persistence "context" $) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        # Chromium (PDF rendering) exhausts the 64MB default /dev/shm; an in-memory emptyDir is required.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.api.devShm.sizeLimit }}
        - name: tmp
          emptyDir: {}
        {{- with .Values.api.extraVolumes }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
