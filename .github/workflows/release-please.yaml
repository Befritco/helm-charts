---
name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build the publish matrix
        id: set-matrix
        env:
          RELEASE_OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: |
          echo "$RELEASE_OUTPUTS" > /tmp/release-outputs.json
          matrix=$(jq -c '
            (.paths_released // "[]" | fromjson) as $paths
            | [
                $paths[] as $path
                | {
                    path: $path,
                    chart: ($path | split("/")[1]),
                    version: .[$path + "--version"],
                    tag: .[$path + "--tag_name"]
                  }
              ]
          ' /tmp/release-outputs.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.chart }}
    needs: release-please
    if: needs.release-please.outputs.paths_released != '[]'
    permissions:
      contents: write
      packages: write
      id-token: write
    strategy:
      matrix:
        include: ${{ fromJSON(needs.release-please.outputs.matrix) }}
    uses: ./.github/workflows/publish-chart.yaml
    with:
      chart: ${{ matrix.chart }}
      version: ${{ matrix.version }}
      tag: ${{ matrix.tag }}

  pages-index:
    name: Update Pages index
    needs:
      - release-please
      - publish
    if: needs.release-please.outputs.paths_released != '[]'
    concurrency: gh-pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0

      - name: Download packaged charts
        uses: actions/download-artifact@v8
        with:
          pattern: chart-*
          path: .cr-release-packages
          merge-multiple: true

      - name: Install chart-releaser
        uses: helm/chart-releaser-action@v1
        with:
          install_only: true

      - name: Update index.yaml and publish to GitHub Pages
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cr index \
            -o befritco \
            -r helm-charts \
            -i gh-pages/index.yaml \
            --release-name-template "{{ .Name }}-{{ .Version }}"

          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: update index.yaml"
            git push origin gh-pages
          else
            echo "index.yaml unchanged"
          fi
