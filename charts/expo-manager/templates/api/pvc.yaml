{{- range $name := list "photos" "reports" }}
{{- $persistence := index $.Values.api.persistence $name }}
{{- if and $persistence.enabled (not $persistence.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "expo-manager.api.claimName" (dict "name" $name "persistence" $persistence "context" $) }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "expo-manager.labels" $ | nindent 4 }}
    app.kubernetes.io/component: api
    {{- with $persistence.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if or $persistence.annotations $.Values.commonAnnotations $.Values.api.persistence.resourcePolicy }}
  annotations:
    {{- with $.Values.api.persistence.resourcePolicy }}
    helm.sh/resource-policy: {{ . | quote }}
    {{- end }}
    {{- with $.Values.commonAnnotations }}
    {{- tpl (toYaml .) $ | nindent 4 }}
    {{- end }}
    {{- with $persistence.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml $persistence.accessModes | nindent 4 }}
  {{- include "expo-manager.storageClass" (dict "persistence" $persistence "global" $.Values.global) | nindent 2 }}
  resources:
    requests:
      storage: {{ $persistence.size | quote }}
  {{- with $persistence.dataSource }}
  dataSource:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
