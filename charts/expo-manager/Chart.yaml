apiVersion: v2
name: expo-manager
description: Expo event-operations platform (API + web) with a single-node RethinkDB
type: application
# `version` is bumped by release-please (a `feat!:` commit takes it to 2.0.0); `appVersion` is
# maintained by hand and is the default tag of the api/web images.
version: 2.0.0
appVersion: "2.0.0"
kubeVersion: ">=1.29.0-0"
home: https://github.com/Befritco/helm-charts
sources:
  - https://github.com/Befritco/helm-charts
  - https://github.com/Befritco/expo
keywords:
  - expo
  - exposition
  - rethinkdb
maintainers:
  - name: fastlorenzo
dependencies:
  - name: rethinkdb
    version: "1.x.x"
    repository: file://../rethinkdb
    condition: rethinkdb.enabled
