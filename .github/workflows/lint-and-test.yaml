---
name: Lint and test charts

on:
  pull_request:
    branches:
      - main
    paths:
      - charts/**
      - ct.yaml
      - .github/workflows/**
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    name: Lint, template and README/schema freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2

      - name: Run ct lint
        run: ct lint --config ct.yaml

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz" \
            | tar -xz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: helm template + kubeconform
        run: |
          set -euo pipefail
          shopt -s nullglob
          for chart in charts/*/; do
            chart="${chart%/}"
            helm dependency update "$chart"
            for values in "$chart"/ci/*-values.yaml; do
              echo "== $chart :: $values =="
              helm template ci "$chart" -f "$values" \
                --kube-version 1.33.0 \
                --api-versions gateway.networking.k8s.io/v1 \
                | kubeconform -strict -summary -ignore-missing-schemas \
                    -kubernetes-version 1.33.0 \
                    -schema-location default \
                    -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            done
          done

      - name: Install readme-generator-for-helm
        run: npm install -g "github:bitnami/readme-generator-for-helm#3.0.1"

      - name: Check README and values.schema.json freshness
        run: |
          set -euo pipefail
          for chart in charts/*/; do
            chart="${chart%/}"
            readme-generator -v "$chart/values.yaml" -r "$chart/README.md" -s "$chart/values.schema.json"
          done
          git diff --exit-code -- charts

  install:
    name: kind install test
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # `packages: read` lets the job's GITHUB_TOKEN pull the private expo api/web images into
    # kind, once this repository has read access on those packages ("Manage Actions access").
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2

      - name: Run ct list-changed
        id: list-changed
        run: |
          changed=$(ct list-changed --config ct.yaml)
          if [ -n "$changed" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@v1

      - name: Install Gateway API CRDs
        if: steps.list-changed.outputs.changed == 'true'
        run: kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.3.0/standard-install.yaml

      - name: Create expo-ci namespace
        if: steps.list-changed.outputs.changed == 'true'
        run: kubectl create namespace expo-ci

      - name: Create GHCR pull secret
        if: steps.list-changed.outputs.changed == 'true'
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          kubectl -n expo-ci create secret docker-registry befritco-docker-secret \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="$GHCR_PULL_TOKEN"

      - name: Run ct install
        if: steps.list-changed.outputs.changed == 'true'
        run: ct install --config ct.yaml
