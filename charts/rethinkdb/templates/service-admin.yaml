{{- if .Values.httpAdmin.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rethinkdb.fullname" . }}-admin
  labels:
    {{- include "rethinkdb.labels" . | nindent 4 }}
  {{- with .Values.httpAdmin.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    {{- include "rethinkdb.selectorLabels" . | nindent 4 }}
{{- end }}
