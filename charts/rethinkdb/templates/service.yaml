apiVersion: v1
kind: Service
metadata:
  name: {{ include "rethinkdb.fullname" . }}
  labels:
    {{- include "rethinkdb.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: tcp-driver
      port: 28015
      targetPort: tcp-driver
  selector:
    {{- include "rethinkdb.selectorLabels" . | nindent 4 }}
