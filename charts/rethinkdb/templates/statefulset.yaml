{{- $replicas := int .Values.replicaCount -}}
{{- if lt $replicas 1 -}}
{{- fail "rethinkdb: replicaCount must be at least 1." -}}
{{- end -}}
{{- $fullname := include "rethinkdb.fullname" . -}}
{{- $peerDomain := printf "%s-headless.%s.svc.%s" $fullname .Release.Namespace .Values.clusterDomain -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "rethinkdb.fullname" . }}
  labels:
    {{- include "rethinkdb.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "rethinkdb.fullname" . }}-headless
  replicas: {{ $replicas }}
  # OrderedReady (the default) is immutable once created, so it is kept for 1.0.0 installs; the
  # join logic in the container command relies on it (lower ordinals are Ready before a pod starts).
  podManagementPolicy: OrderedReady
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      {{- include "rethinkdb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rethinkdb.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "rethinkdb.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "rethinkdb.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- else if gt $replicas 1 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "rethinkdb.selectorLabels" . | nindent 20 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: rethinkdb
          image: {{ include "rethinkdb.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command:
            - sh
            - -ec
            - |
              # Server name: the pod hostname with every character RethinkDB rejects mapped to "_"
              # (it allows [A-Za-z0-9_] only). Ignored, with a warning, once the data directory
              # already carries a name -- RethinkDB keeps the persisted identity.
              HOSTNAME="${HOSTNAME:-$(cat /proc/sys/kernel/hostname)}"
              server_name="$(printf '%s' "$HOSTNAME" | tr -c 'A-Za-z0-9_' '_')"
              set -- --server-name "$server_name" --canonical-address "$HOSTNAME.$PEER_DOMAIN"
              {{- if gt $replicas 1 }}
              # Cluster members: --join every other ordinal by its stable headless-Service name.
              # RethinkDB exits when a --join hostname does not resolve at startup, and only opens
              # its driver port once one join has succeeded, so the peer list is built to match
              # what OrderedReady guarantees: lower ordinals exist (and are Ready) before this pod
              # starts, so they are waited for (bounded) and joined; higher ordinals are joined
              # only if they already resolve (rolling restart, full-cluster restart) and are
              # otherwise left to dial this pod themselves when they come up. On a cold start
              # pod 0 therefore starts alone and every later pod joins its predecessors.
              ordinal="${HOSTNAME##*-}"
              deadline=$(( $(date +%s) + {{ int .Values.cluster.peerResolveTimeoutSeconds }} ))
              for i in $(seq 0 {{ sub $replicas 1 }}); do
                [ "$i" -eq "$ordinal" ] && continue
                peer="{{ $fullname }}-$i.$PEER_DOMAIN"
                if [ "$i" -lt "$ordinal" ]; then
                  until getent hosts "$peer" >/dev/null 2>&1; do
                    if [ "$(date +%s)" -ge "$deadline" ]; then
                      echo "rethinkdb: peer $peer did not resolve in time, starting without it" >&2
                      break
                    fi
                    sleep 2
                  done
                fi
                getent hosts "$peer" >/dev/null 2>&1 && set -- "$@" --join "$peer:29015"
              done
              {{- end }}
              exec rethinkdb --bind all --directory /data/db --cache-size {{ .Values.cacheSizeMB }} \
              {{- if not .Values.httpAdmin.enabled }}
                --no-http-admin \
              {{- end }}
                --initial-password "$RETHINKDB_PASSWORD" "$@"
          env:
            - name: RETHINKDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "rethinkdb.secretName" . }}
                  key: rethinkdb-password
            - name: PEER_DOMAIN
              value: {{ $peerDomain | quote }}
          ports:
            - name: tcp-driver
              containerPort: 28015
            - name: tcp-cluster
              containerPort: 29015
            {{- if .Values.httpAdmin.enabled }}
            - name: http
              containerPort: 8080
            {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            tcpSocket:
              port: tcp-driver
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            successThreshold: {{ .Values.startupProbe.successThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            tcpSocket:
              port: tcp-driver
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
            successThreshold: {{ .Values.readinessProbe.successThreshold }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            tcpSocket:
              port: tcp-driver
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
            successThreshold: {{ .Values.livenessProbe.successThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "rethinkdb.selectorLabels" . | nindent 10 }}
          {{- with .Values.persistence.labels }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- include "rethinkdb.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
        {{- with .Values.persistence.dataSource }}
        dataSource:
          {{- toYaml . | nindent 10 }}
        {{- end }}
