---
name: Publish chart

on:
  workflow_call:
    inputs:
      chart:
        description: Chart directory name under charts/ (e.g. expo-manager)
        required: true
        type: string
      version:
        description: Chart version to publish (must match Chart.yaml)
        required: true
        type: string
      tag:
        description: Git tag to check out and upload the release asset to
        required: true
        type: string
  workflow_dispatch:
    inputs:
      chart:
        description: Chart directory name under charts/ (e.g. expo-manager)
        required: true
        type: string
      version:
        description: Chart version to publish (must match Chart.yaml)
        required: true
        type: string
      tag:
        description: Git tag to check out and upload the release asset to
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    name: Publish ${{ inputs.chart }}-${{ inputs.version }}
    runs-on: ubuntu-latest
    env:
      CHART: ${{ inputs.chart }}
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout ${{ inputs.tag }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Update chart dependencies
        run: helm dependency update "charts/$CHART"

      - name: Lint chart
        run: helm lint "charts/$CHART"

      - name: Package chart
        run: |
          mkdir -p .cr-release-packages
          helm package "charts/$CHART" -d .cr-release-packages

      - name: Verify package name matches the release
        run: |
          test -f ".cr-release-packages/${CHART}-${VERSION}.tgz"

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push chart to GHCR
        id: push
        run: |
          set -euo pipefail
          output=$(helm push ".cr-release-packages/${CHART}-${VERSION}.tgz" oci://ghcr.io/befritco/charts 2>&1 | tee /dev/stderr)
          digest=$(echo "$output" | grep -oE 'Digest: sha256:[0-9a-f]+' | awk '{print $2}')
          if [ -z "$digest" ]; then
            echo "Could not determine pushed chart digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign the published chart (keyless)
        run: |
          cosign sign --yes "ghcr.io/befritco/charts/${CHART}@${{ steps.push.outputs.digest }}"

      - name: Upload chart to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" ".cr-release-packages/${CHART}-${VERSION}.tgz" \
            --clobber \
            --repo "${{ github.repository }}"

      - name: Upload chart artifact for the Pages index job
        uses: actions/upload-artifact@v7
        with:
          name: chart-${{ inputs.chart }}
          path: .cr-release-packages/${{ inputs.chart }}-${{ inputs.version }}.tgz
          retention-days: 7
