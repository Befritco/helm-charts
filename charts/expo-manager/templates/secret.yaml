{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "expo-manager.secretName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "expo-manager.labels" . | nindent 4 }}
  {{- with include "expo-manager.annotations" . }}
  {{- . | nindent 2 }}
  {{- end }}
type: Opaque
data:
  jwt-secret: {{ include "expo-manager.secretValue" (dict "context" $ "key" "jwt-secret" "value" .Values.jwtSecret "length" 48) | b64enc | quote }}
  initial-user-password: {{ include "expo-manager.secretValue" (dict "context" $ "key" "initial-user-password" "value" .Values.initialUserPassword "length" 16) | b64enc | quote }}
  email-sender-password: {{ .Values.email.senderPassword | b64enc | quote }}
  {{- if and (not .Values.rethinkdb.enabled) (not .Values.rethinkdb.existingSecret) }}
  # External RethinkDB without rethinkdb.existingSecret: the API reads its password from here.
  rethinkdb-password: {{ .Values.rethinkdb.rethinkdbPassword | b64enc | quote }}
  {{- end }}
{{- end }}
