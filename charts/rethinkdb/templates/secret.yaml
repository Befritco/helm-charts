{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rethinkdb.secretName" . }}
  labels:
    {{- include "rethinkdb.labels" . | nindent 4 }}
  annotations:
    # Kept on uninstall, like the data PVCs it unlocks: a reinstall under the same release name
    # adopts it and keeps the password the retained volumes were initialised with.
    helm.sh/resource-policy: keep
type: Opaque
data:
  rethinkdb-password: {{ include "rethinkdb.password" . | b64enc | quote }}
{{- end }}
