apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-web" (include "expo-manager.fullname" .) }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "expo-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  {{- with include "expo-manager.annotations" . }}
  {{- . | nindent 2 }}
  {{- end }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  strategy:
    type: {{ .Values.web.updateStrategy.type }}
  selector:
    matchLabels:
      {{- include "expo-manager.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "expo-manager.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
        {{- with .Values.web.podLabels }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
      {{- with .Values.web.podAnnotations }}
      annotations:
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
    spec:
      {{- with include "expo-manager.imagePullSecrets" . }}
      {{- . | nindent 6 }}
      {{- end }}
      serviceAccountName: {{ include "expo-manager.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.web.terminationGracePeriodSeconds }}
      {{- with .Values.web.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.web.initContainers }}
      initContainers:
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "expo-manager.image" (dict "image" .Values.web.image "global" .Values.global "chart" .Chart) | quote }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          {{- with .Values.web.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            # Explicit: the image's own default is `api:9000`, which only resolves in the compose stack.
            - name: API_UPSTREAM
              value: {{ .Values.web.apiUpstream | default (printf "%s:%d" (include "expo-manager.api.serviceName" .) (int .Values.api.service.port)) | quote }}
            {{- with .Values.web.dnsResolver }}
            - name: DNS_RESOLVER
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.web.extraEnvVars }}
            {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.web.containerPort }}
              protocol: TCP
          {{- if gt (int .Values.web.preStopSleepSeconds) 0 }}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", {{ .Values.web.preStopSleepSeconds | quote }}]
          {{- end }}
          {{- if .Values.web.startupProbe.enabled }}
          startupProbe:
            {{- include "expo-manager.httpProbe" (dict "probe" .Values.web.startupProbe "path" .Values.web.healthPath) | nindent 12 }}
          {{- end }}
          {{- if .Values.web.readinessProbe.enabled }}
          readinessProbe:
            {{- include "expo-manager.httpProbe" (dict "probe" .Values.web.readinessProbe "path" .Values.web.healthPath) | nindent 12 }}
          {{- end }}
          {{- if .Values.web.livenessProbe.enabled }}
          livenessProbe:
            {{- include "expo-manager.httpProbe" (dict "probe" .Values.web.livenessProbe "path" .Values.web.healthPath) | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          {{- with .Values.web.extraVolumeMounts }}
          volumeMounts:
            {{- tpl (toYaml .) $ | nindent 12 }}
          {{- end }}
      {{- with .Values.web.extraVolumes }}
      volumes:
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
