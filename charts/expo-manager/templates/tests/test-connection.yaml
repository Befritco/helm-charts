apiVersion: v1
kind: Pod
metadata:
  name: {{ include "expo-manager.fullname" . }}-test-connection
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "expo-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  {{- with include "expo-manager.imagePullSecrets" . }}
  {{- . | nindent 2 }}
  {{- end }}
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: curl
      image: {{ .Values.tests.image.registry }}/{{ .Values.tests.image.repository }}:{{ .Values.tests.image.tag }}
      imagePullPolicy: {{ .Values.tests.image.pullPolicy }}
      command:
        - sh
        - -ec
        - |
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors --max-time 10 \
            "http://{{ include "expo-manager.api.serviceName" . }}:{{ .Values.api.service.port }}{{ .Values.api.healthPath }}"
          echo
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors --max-time 10 \
            "http://{{ include "expo-manager.web.serviceName" . }}:{{ .Values.web.service.port }}{{ .Values.web.healthPath }}"
          echo
